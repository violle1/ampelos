<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" width="100%" height="100%" fill="none">
  <!-- Grappolo e Foglia Ampelos -->
  <g id="grape-mark" stroke="#142b1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Picciolo e viticcio superiore -->
    <path d="M 190,6 C 187,14 182,18 174,21 C 166,24 158,22 154,16 C 151,11 154,5 160,5 C 168,5 174,13 180,18" stroke-width="2" />
    <path d="M 190,6 L 190,26" stroke-width="3" />
    <path d="M 190,14 C 196,16 206,14 212,8 C 216,4 222,6 222,12 C 222,18 214,24 204,25" stroke-width="1.8" />

    <!-- Foglia di vite stilizzata a destra -->
    <path d="M 194,22 C 204,14 216,13 226,17 C 234,21 242,19 248,25 C 246,33 240,36 242,43 C 235,46 228,43 222,48 C 218,44 214,46 208,44 C 202,38 198,34 194,26 Z" 
          fill="#264733" fill-opacity="0.18" stroke="#142b1f" stroke-width="2" />
    <!-- Nervature foglia -->
    <path d="M 198,24 L 230,30" stroke="#142b1f" stroke-width="1.4" opacity="0.8" />
    <path d="M 212,27 L 222,21" stroke="#142b1f" stroke-width="1.2" opacity="0.8" />
    <path d="M 218,28 L 226,38" stroke="#142b1f" stroke-width="1.2" opacity="0.8" />

    <!-- Acini del grappolo (Contrasto elevato, riempimento pieno con riflesso) -->
    <!-- Livello 1 (Alto) -->
    <circle cx="168" cy="34" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="182" cy="31" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="196" cy="31" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="210" cy="34" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />

    <!-- Livello 2 -->
    <circle cx="162" cy="47" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="175" cy="44" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="189" cy="43" r="7.8" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="203" cy="44" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="216" cy="47" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />

    <!-- Livello 3 -->
    <circle cx="170" cy="58" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="183" cy="56" r="7.8" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="197" cy="56" r="7.8" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="210" cy="58" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />

    <!-- Livello 4 -->
    <circle cx="177" cy="69" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="190" cy="68" r="7.8" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="203" cy="69" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />

    <!-- Livello 5 -->
    <circle cx="184" cy="80" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />
    <circle cx="196" cy="80" r="7.5" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />

    <!-- Puntale inferiore -->
    <circle cx="190" cy="91" r="7" fill="#faf7f2" stroke="#142b1f" stroke-width="2.2" />

    <!-- Dettagli luce interna acini -->
    <path d="M 180,28 A 4 4 0 0 1 184,33" stroke="#142b1f" stroke-width="1.4" opacity="0.75" />
    <path d="M 173,41 A 4 4 0 0 1 177,46" stroke="#142b1f" stroke-width="1.4" opacity="0.75" />
    <path d="M 187,40 A 4 4 0 0 1 191,45" stroke="#142b1f" stroke-width="1.4" opacity="0.75" />
    <path d="M 181,53 A 4 4 0 0 1 185,58" stroke="#142b1f" stroke-width="1.4" opacity="0.75" />
    <path d="M 188,65 A 4 4 0 0 1 192,70" stroke="#142b1f" stroke-width="1.4" opacity="0.75" />
  </g>

  <!-- Linee orizzontali divisorie eleganti con punto centrale -->
  <line x1="30" y1="108" x2="135" y2="108" stroke="#142b1f" stroke-width="1" opacity="0.4" />
  <circle cx="140" cy="108" r="1.8" fill="#142b1f" opacity="0.5" />
  <circle cx="240" cy="108" r="1.8" fill="#142b1f" opacity="0.5" />
  <line x1="245" y1="108" x2="350" y2="108" stroke="#142b1f" stroke-width="1" opacity="0.4" />

  <!-- Tipografia Greca Principale: ἄμπελος (Più grande, definita e leggibile) -->
  <text x="190" y="128" 
        font-family="'Cormorant Garamond', 'Playfair Display', 'Times New Roman', Georgia, serif" 
        font-size="44" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#142b1f" 
        text-anchor="middle">ἄμπελος</text>

  <!-- Tipografia Latina: AMPELOS (Alta visibilità con tracking largo) -->
  <text x="190" y="152" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="13" 
        font-weight="800" 
        letter-spacing="7" 
        fill="#264733" 
        text-anchor="middle">AMPELOS</text>
</svg>
